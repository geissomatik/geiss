# SwiftLint settings for the macOS app. Run from the repo root:
#   swiftlint lint
# Only "error" findings fail the pre-commit hook; warnings are shown but don't block.

included:
  - macos

identifier_name:
  excluded:
    - dt     # time step, the usual name in the render loop
    - x
    - y
    - i
    - where_ # a Core Audio label argument

line_length:
  warning: 140
  error: 200
  ignores_comments: true

large_tuple:
  warning: 3
  error: 5

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 60
  error: 120

# Force tries show up as warnings so they are visible without blocking commits.
force_try:
  severity: warning
